<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0c1d">
  <meta name="description" content="Player Too: match with people who play what you play. Find a date or a duo.">
  <title>Player Too</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="logo" href="#discover" aria-label="Player Too home">
        <span class="logo-mark">P2</span><span>Player Too</span>
      </a>
      <span id="demo-badge" class="badge" hidden>Demo</span>
    </header>
    <main id="app" aria-live="polite"></main>
    <nav id="tabs" class="tabs" hidden>
      <a href="#discover" data-tab="discover"><span aria-hidden="true">🎮</span>Discover</a>
      <a href="#matches" data-tab="matches"><span aria-hidden="true">💬</span>Matches</a>
      <a href="#profile" data-tab="profile"><span aria-hidden="true">👤</span>Profile</a>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
